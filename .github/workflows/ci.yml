name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cerebro_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend/services/ backend/tests/

      - name: Type check
        run: mypy backend/services/ --ignore-missing-imports
        continue-on-error: true

      # Verify the schema actually applies to a real Postgres, rather than
      # discovering at deploy time that it doesn't.
      - name: Apply schema
        env: {PGPASSWORD: test}
        run: psql -h localhost -U postgres -d cerebro_test -v ON_ERROR_STOP=1 -f backend/db/schema_portable.sql

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/cerebro_test
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY: ci-encryption-key-for-testing-only
        run: cd backend && pytest tests/ -v --cov=services --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci

      # Layered quality gate — each check fails fast and points at what to fix.
      - name: Type safety
        run: npm run typecheck
      - name: Lint + accessibility (eslint + jsx-a11y)
        run: npm run lint
      - name: Unit & component tests (Vitest + Testing Library + MSW)
        run: npm test
      - name: Build
        run: npm run build:client
      - name: Bundle-size budget
        run: npm run size

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end smoke tests (Playwright, desktop + mobile)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: playwright-report, path: frontend/playwright-report, retention-days: 7}
