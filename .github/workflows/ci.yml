name: CI

on:
  push: {branches: [main]}
  pull_request: {branches: [main]}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cerebro_test
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}

      - name: Install
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check backend/services/ backend/tests/

      - name: Type check
        run: mypy backend/services/ --ignore-missing-imports
        continue-on-error: true

      # Verify the schema actually applies to a real Postgres, rather than
      # discovering at deploy time that it doesn't.
      - name: Apply schema
        env: {PGPASSWORD: test}
        run: psql -h localhost -U postgres -d cerebro_test -v ON_ERROR_STOP=1 -f backend/db/schema_portable.sql

      - name: Tests
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/cerebro_test
          SECRET_KEY: ci-secret-key-at-least-32-characters-long
          TOKEN_ENCRYPTION_KEY: ci-encryption-key-for-testing-only
        run: cd backend && pytest tests/ -v --cov=services --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run build:client
